    <div id="audio-controls" style="position: fixed; bottom: 20px; right: 20px; z-index: 9999;" class="d-flex gap-2">
       <button class="btn btn-success shadow" onclick="readWholePage()" title="Play">
           ▶️
       </button>
       <button class="btn btn-warning shadow" onclick="pauseReading()" title="Pause">
           ⏸️
       </button>
       <button class="btn btn-danger shadow" onclick="stopReading()" title="Stop">
           ⏹️
       </button>
    </div>
   
    <script>
       let utterance = null;
   
       function readWholePage() {
           if (speechSynthesis.speaking) {
               speechSynthesis.cancel(); // restart if already speaking
           }
           utterance = new SpeechSynthesisUtterance(document.body.innerText);
           speechSynthesis.speak(utterance);
       }
   
       function pauseReading() {
           if (speechSynthesis.speaking && !speechSynthesis.paused) {
               speechSynthesis.pause();
           }
       }
   
       function stopReading() {
           speechSynthesis.cancel();
       }
    </script>

    </body>

    <!-- Reservation Section -->
    <section class="reservation-section py-5">
        <div class="container">
            <div class="row align-items-center">
                <!-- Reservation Form -->
                <div class="col-md-6">
                    <h1 class="mb-4">Reserve Your Table</h1>
                    <p class="mb-4">We can't wait to serve you! Book your table in advance to enjoy a hassle-free dining experience.</p>
                    <form class="reservation-form">
                        <div class="mb-3">
                            <label for="name" class="form-label">Full Name:</label>
                            <input type="text" id="name" name="name" class="form-control" placeholder="Enter your full name" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email:</label>
                            <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required>
                        </div>
                        <div class="mb-3">
                            <label for="phone" class="form-label">Phone Number:</label>
                            <input type="tel" id="phone" name="phone" class="form-control" placeholder="Enter your phone number" required>
                        </div>
                        <div class="mb-3">
                            <label for="date" class="form-label">Date:</label>
                            <input type="date" id="date" name="date" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="time" class="form-label">Time:</label>
                            <input type="time" id="time" name="time" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="guests" class="form-label">Number of Guests:</label>
                            <select id="guests" name="guests" class="form-select" required>
                                <option value="1">1 Person</option>
                                <option value="2">2 People</option>
                                <option value="3">3 People</option>
                                <option value="4">4 People</option>
                                <option value="5">5+ People</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="occasion" class="form-label">Occasion:</label>
                            <select id="occasion" name="occasion" class="form-select">
                                <option value="none">None</option>
                                <option value="birthday">Birthday</option>
                                <option value="anniversary">Anniversary</option>
                                <option value="business">Business Meeting</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="message" class="form-label">Special Requests:</label>
                            <textarea id="message" name="message" class="form-control" placeholder="Let us know if you have any special requests (optional)" rows="4"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Confirm Reservation</button>
                    </form>
                </div>
                <!-- Reservation Image -->
                <div class="col-md-6">
                    <img src="Media/Reservation clown.jpeg" alt="Reservation Image" class="img-fluid rounded">
                </div>
            </div>
        </div>
    </section>
