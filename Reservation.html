    <section class="reservation-section">
        <div class="reservation-container">
            <h1>Reserve Your Table</h1>
            <p>We can't wait to serve you! Book your table in advance to enjoy a hassle-free dining experience.</p>

            <form class="reservation-form">
                <label for="name">Full Name:</label><br><br>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required><br><br>

                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" placeholder="Enter your email" required><br>

                <label for="phone">Phone Number:</label><br>
                <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required><br>

                <label for="date">Date:</label><br>
                <input type="date" id="date" name="date" required>

                <label for="time">Time:</label>
                <input type="time" id="time" name="time" required>

                <label for="guests">Number of Guests:</label>
                <select id="guests" name="guests" required>
                    <option value="1">1 Person</option>
                    <option value="2">2 People</option>
                    <option value="3">3 People</option>
                    <option value="4">4 People</option>
                    <option value="5">5+ People</option>
                </select>

                <label for="occasion">Occasion:</label>
                <select id="occasion" name="occasion">
                    <option value="none">None</option>
                    <option value="birthday">Birthday</option>
                    <option value="anniversary">Anniversary</option>
                    <option value="business">Business Meeting</option>
                    <option value="other">Other</option>
                </select>
                <label for="message">Special Requests:</label>
                <textarea id="message" name="message" placeholder="Let us know if you have any special requests (optional)" rows="4"></textarea>

                <button type="submit">Confirm Reservation</button>
            </form>
        </div>
        <div class="reservation-image">
            <img src="assets/images/AdobeStock_302613902_Preview_Editorial_Use_Only.jpeg" alt="Reservation Image">
        </div>
       
    </section>
