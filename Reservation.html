<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McDonald's Reservations</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="Media/logo3.jpeg" alt="McDonald's Logo" width="50">
                McDonald's
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
                    <li class="nav-item"><a class="nav-link" href="Historical.html">History</a></li>
                    <li class="nav-item"><a class="nav-link active" href="Reservation.html">Reservations</a></li>
                    <li class="nav-item"><a class="nav-link" href="feedback.html">Feedback</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Reservation Section -->
    <section class="reservation-section py-5">
        <div class="container">
            <div class="row align-items-center">
                <!-- Reservation Form -->
                <div class="col-md-6">
                    <h1 class="mb-4">Reserve Your Table</h1>
                    <p class="mb-4">We can't wait to serve you! Book your table in advance to enjoy a hassle-free dining experience.</p>
                    <form class="reservation-form">
                        <div class="mb-3">
                            <label for="name" class="form-label">Full Name:</label>
                            <input type="text" id="name" name="name" class="form-control" placeholder="Enter your full name" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email:</label>
                            <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required>
                        </div>
                        <div class="mb-3">
                            <label for="phone" class="form-label">Phone Number:</label>
                            <input type="tel" id="phone" name="phone" class="form-control" placeholder="Enter your phone number" required>
                        </div>
                        <div class="mb-3">
                            <label for="date" class="form-label">Date:</label>
                            <input type="date" id="date" name="date" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="time" class="form-label">Time:</label>
                            <input type="time" id="time" name="time" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="guests" class="form-label">Number of Guests:</label>
                            <select id="guests" name="guests" class="form-select" required>
                                <option value="1">1 Person</option>
                                <option value="2">2 People</option>
                                <option value="3">3 People</option>
                                <option value="4">4 People</option>
                                <option value="5">5+ People</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="occasion" class="form-label">Occasion:</label>
                            <select id="occasion" name="occasion" class="form-select">
                                <option value="none">None</option>
                                <option value="birthday">Birthday</option>
                                <option value="anniversary">Anniversary</option>
                                <option value="business">Business Meeting</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="message" class="form-label">Special Requests:</label>
                            <textarea id="message" name="message" class="form-control" placeholder="Let us know if you have any special requests (optional)" rows="4"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Confirm Reservation</button>
                    </form>
                </div>

                <!-- Reservation Image -->
                <div class="col-md-6">
                    <img src="Media/Reservation clown.jpeg" alt="Reservation Image" class="img-fluid rounded">
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer bg-dark text-white py-4">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-4 text-center text-md-start mb-3 mb-md-0">
                    <img src="Media/logo3.jpeg" alt="McDonald's Logo" class="img-fluid" style="max-width: 150px;">
                </div>
                <div class="col-md-4 text-center mb-3 mb-md-0">
                    <nav>
                        <a href="index.html" class="text-white text-decoration-none me-3">Home</a>
                        <a href="menu.html" class="text-white text-decoration-none me-3">Menu</a>
                        <a href="Historical.html" class="text-white text-decoration-none me-3">History</a>
                        <a href="Reservation.html" class="text-white text-decoration-none me-3">Reservations</a>
                        <a href="feedback.html" class="text-white text-decoration-none">Feedback</a>
                    </nav>
                </div>
                <div class="col-md-4 text-center text-md-end">
                    <a href="https://www.facebook.com/McDonalds" class="text-white me-3"><i class="fab fa-facebook"></i></a>
                    <a href="https://www.twitter.com/McDonalds" class="text-white me-3"><i class="fab fa-twitter"></i></a>
                    <a href="https://www.instagram.com/McDonalds" class="text-white"><i class="fab fa-instagram"></i></a>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col text-center">
                    <p class="mb-0">&copy; 2025 McDonald's. All rights reserved.</p>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
